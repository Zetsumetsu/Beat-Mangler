name: Build VST3 (macOS)

# Builds the Break Mangler VST3 as a universal binary (Intel + Apple Silicon)
# on a Microsoft-hosted macOS runner, re-signs it ad-hoc (the CI signature
# does not survive artifact packaging), wraps it in a proper .vst3 bundle
# via ditto, and uploads the zip as a downloadable artifact.
# Trigger: any push touching vst/, dsp/, or this workflow, or manual run.

on:
  push:
    paths:
      - 'vst/**'
      - 'dsp/**'
      - '.github/workflows/build-vst3-macos.yml'
  workflow_dispatch:

jobs:
  build-vst3:
    runs-on: macos-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Configure (CMake, universal binary)
        run: cmake -B build -S vst -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build VST3
        run: cmake --build build --config Release

      - name: Re-sign bundle and package
        run: |
          BUNDLE="build/BreakManglerVST_artefacts/Release/VST3/Break Mangler.vst3"
          codesign --force --deep --sign - "$BUNDLE"
          codesign -v "$BUNDLE" && echo "Signature OK"
          cd "build/BreakManglerVST_artefacts/Release/VST3"
          ditto -c -k --sequesterRsrc --keepParent "Break Mangler.vst3" "$GITHUB_WORKSPACE/Break-Mangler-VST3-macos.zip"

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v6
        with:
          name: Break-Mangler-VST3-macos
          path: Break-Mangler-VST3-macos.zip
